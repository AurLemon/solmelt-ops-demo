services:
  mysql:
    image: mysql:8.4
    container_name: solmelt-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-solmelt_root_dev}
      MYSQL_DATABASE: ${DATABASE_NAME:-solmelt_ops}
      MYSQL_USER: ${DATABASE_USER:-solmelt}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-solmelt_dev}
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:${DATABASE_PORT:-3306}:3306'
    volumes:
      - solmelt-mysql-data:/var/lib/mysql
      - ./docker/mysql/init-shadow-db.sh:/docker-entrypoint-initdb.d/10-init-shadow-db.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  solmelt-mysql-data:
